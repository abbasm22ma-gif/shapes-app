<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Flow Diagrams</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    background: #f0f4f8;
    font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .app {
    background: #ffffff;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 1400px;
    margin: 20px auto;
  }
  
  /* Centred Main Page Title */
  .page-title {
    font-size: 2rem;
    font-weight: 700;
    color: #1e3a8a;
    text-align: center;
    margin: 0 0 20px 0;
    padding-bottom: 10px;
    border-bottom: 3px solid #e2e8f0;
  }

  .toolbar {
    display: flex; gap: 10px; align-items: center;
    padding: 0 0 16px 0;
    flex-wrap: wrap;
  }
  .toolbar button, .toolbar select {
    background: #4f46e5;
    border: none;
    color: #ffffff;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .toolbar select { background: #1e293b; padding: 10px 15px; outline: none; }
  .toolbar button:hover { background: #4338ca; }
  .toolbar button.reset-btn { background: #ef4444; }
  .toolbar button.reset-btn:hover { background: #dc2626; }
  .toolbar button.check-btn { background: #10b981; }
  .toolbar button.check-btn:hover { background: #059669; }
  
  .toolbar button.close-btn {
    background: #64748b;
    margin-left: auto; 
    align-self: center;
    border-left: 2px solid #cbd5e1;
    padding-left: 20px;
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
    border-top-right-radius: 6px;
    border-bottom-right-radius: 6px;
  }
  .toolbar button.close-btn:hover { background: #475569; }
  
  .add-tools {
    display: flex;
    gap: 8px;
    margin-left: 10px;
    padding-left: 10px;
    border-left: 2px solid #cbd5e1;
    flex-wrap: wrap;
    align-items: center;
  }
  .add-tools button {
    background: #f8fafc;
    color: #1e293b;
    border: 1px solid #cbd5e1;
    padding: 8px 12px;
    font-size: 0.85rem;
    box-shadow: none;
  }
  .add-tools button:hover { background: #e2e8f0; }

  .label-editor {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f8fafc;
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
  }
  .label-editor span { font-size: 0.85rem; font-weight: 600; color: #64748b; }
  .label-editor input {
    border: none; background: transparent; padding: 6px;
    font-size: 0.95rem; outline: none; width: 140px; color: #1e293b;
  }
  .label-editor input:disabled { color: #94a3b8; cursor: not-allowed; }

  .slider-control {
    display: none;
    align-items: center;
    gap: 8px;
    background: #eff6ff;
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid #bfdbfe;
  }
  .slider-control span { font-size: 0.85rem; font-weight: 600; color: #1e40af; }
  .slider-control input[type="range"] { width: 100px; cursor: pointer; }

  /* Main Layout */
  .main-area {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  /* Side panel for questions */
  .question-panel {
    width: 350px;
    background: #f8fafc;
    border: 2px solid #cbd5e1;
    border-radius: 8px;
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 15px;
    flex-shrink: 0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  .question-panel h3 { margin: 0; color: #1e293b; font-size: 1.1rem; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; }
  .question-panel p { margin: 0; font-size: 0.9rem; color: #475569; line-height: 1.5; }
  .question-panel ul { margin: 0; padding-left: 20px; font-size: 0.9rem; color: #475569; line-height: 1.5; }
  .question-panel li { margin-bottom: 6px; }

  .canvas-wrap {
    position: relative;
    flex-grow: 1;
    height: 75vh;
    background: #ffffff;
    border: 2px solid #cbd5e1;
    border-radius: 8px;
    overflow: auto;
  }
  canvas {
    display: block;
    cursor: grab;
    touch-action: none;
  }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>

<div class="app">
  
  <h1 class="page-title">Data Flow Diagrams</h1>

  <div class="toolbar">
    <select id="challengeSelect">
      <option value="none">-- Practice Mode (No Marking) --</option>
      <option value="q1">Q1: IT Support Request (5 marks)</option>
      <option value="q2">Q2: Equipment Booking (6 marks)</option>
      <option value="q3">Q3: Processing Request (7 marks)</option>
      <option value="q4">Q4: Network Fault Reporting (8 marks)</option>
      <option value="q5">Q5: Cyber Security Incident (9 marks)</option>
    </select>
    
    <button class="check-btn" id="checkBtn" type="button" style="display: none;">✓ Check Answer</button>
    <button class="reset-btn" id="resetBtn" type="button">⟲ Reset Canvas</button>
    
    <div class="add-tools">
      <button id="addDataStore">+ Data Store</button>
      <button id="addProcess">+ Process</button>
      <button id="addEntity">+ Entity (Oval)</button>
      <button id="addArrow">+ Arrow</button>
    </div>

    <div class="label-editor">
      <span>Label:</span>
      <input type="text" id="textInput" placeholder="Select a shape..." disabled>
    </div>
    
    <div class="slider-control" id="rotateControl">
      <span>Rotate:</span>
      <input type="range" id="rotateSlider" min="0" max="360" value="0">
    </div>

    <div class="slider-control" id="scaleControl">
      <span>Scale:</span>
      <input type="range" id="scaleSlider" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <button class="close-btn" id="closeBtn" type="button">✕ Close Tab</button>
  </div>
  
  <div class="main-area">
    <div class="question-panel" id="questionPanel">
      <h3 id="qTitle">Question Title</h3>
      <p id="qDesc">Description...</p>
      <div id="qRules"></div>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="shapeCanvas" width="1600" height="1200"></canvas>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("shapeCanvas");
  var ctx = canvas.getContext("2d");
  var textInput = document.getElementById("textInput");
  var rotateControl = document.getElementById("rotateControl");
  var rotateSlider = document.getElementById("rotateSlider");
  var scaleControl = document.getElementById("scaleControl");
  var scaleSlider = document.getElementById("scaleSlider");
  
  var challengeSelect = document.getElementById("challengeSelect");
  var questionPanel = document.getElementById("questionPanel");
  var checkBtn = document.getElementById("checkBtn");

  var shapes = [];
  var selectedId = null;
  var nextId = 1;
  var currentChallenge = "none";
  var correctShapeIds = new Set();

  function genId() { return nextId++; }

  function labelHas(shape, keywords) {
    if (!shape.label) return false;
    var l = shape.label.toLowerCase();
    for (var i = 0; i < keywords.length; i++) { if (l.includes(keywords[i].toLowerCase())) return true; }
    return false;
  }

  // ---------- Questions Data ----------
  var questionsData = {
    q1: {
      title: "Q1: Recording an IT support request",
      desc: "Receive request (details, problem). Process it. Return confirmation.",
      rules: "<strong>Requirements:</strong><br><ul><li>1 Entity (Student)</li><li>1 Process (Record)</li><li>Flows: details, confirmation</li></ul>",
      check: function(shapes) {
        var results = [];
        var entity = shapes.find(s => s.type === "entity" && labelHas(s, ["student", "user"]));
        if (entity) { correctShapeIds.add(entity.id); results.push({ text: "Entity: Student", pass: true }); } else { results.push({ text: "Entity: Student", pass: false }); }
        var process = shapes.find(s => s.type === "process" && labelHas(s, ["record", "process", "support", "request"]));
        if (process) { correctShapeIds.add(process.id); results.push({ text: "Process: Record Request", pass: true }); } else { results.push({ text: "Process: Record Request", pass: false }); }
        var flow1 = shapes.find(s => s.type === "arrow" && labelHas(s, ["detail", "problem", "request"]));
        if (flow1) { correctShapeIds.add(flow1.id); results.push({ text: "Flow: Request details", pass: true }); } else { results.push({ text: "Flow: Request details", pass: false }); }
        var flow2 = shapes.find(s => s.type === "arrow" && labelHas(s, ["confirm", "reference", "ref"]));
        if (flow2) { correctShapeIds.add(flow2.id); results.push({ text: "Flow: Confirmation", pass: true }); } else { results.push({ text: "Flow: Confirmation", pass: false }); }
        return results;
      }
    },
    q2: {
      title: "Q2: College equipment booking",
      desc: "Student requests laptop. Check records. Record booking. Send confirmation.",
      rules: "<strong>Requirements:</strong><br><ul><li>Entity: Student</li><li>Process: Booking</li><li>Data Store: Booking Records</li></ul>",
      check: function(shapes) {
        var results = [];
        var entity = shapes.find(s => s.type === "entity" && labelHas(s, ["student", "user"]));
        if (entity) { correctShapeIds.add(entity.id); results.push({ text: "Entity: Student", pass: true }); } else { results.push({ text: "Entity: Student", pass: false }); }
        var process = shapes.find(s => s.type === "process" && labelHas(s, ["book", "equipment", "system"]));
        if (process) { correctShapeIds.add(process.id); results.push({ text: "Process: Booking System", pass: true }); } else { results.push({ text: "Process: Booking System", pass: false }); }
        var store = shapes.find(s => s.type === "datastore" && labelHas(s, ["equipment", "booking", "record"]));
        if (store) { correctShapeIds.add(store.id); results.push({ text: "Data Store: Records", pass: true }); } else { results.push({ text: "Data Store: Records", pass: false }); }
        var flowReq = shapes.find(s => s.type === "arrow" && labelHas(s, ["request", "booking"]));
        if (flowReq) { correctShapeIds.add(flowReq.id); results.push({ text: "Flow: Booking Request", pass: true }); } else { results.push({ text: "Flow: Booking Request", pass: false }); }
        var flowConf = shapes.find(s => s.type === "arrow" && labelHas(s, ["confirm", "success"]));
        if (flowConf) { correctShapeIds.add(flowConf.id); results.push({ text: "Flow: Confirmation", pass: true }); } else { results.push({ text: "Flow: Confirmation", pass: false }); }
        return results;
      }
    },
    q3: {
      title: "Q3: Processing an IT support request",
      desc: "Record request, retrieve details, create ticket, send ref.",
      rules: "<strong>Requirements:</strong><br><ul><li>Entity: Employee</li><li>2+ Processes</li><li>Data Stores: Employee & Ticket</li></ul>",
      check: function(shapes) {
        var results = [];
        var entity = shapes.find(s => s.type === "entity" && labelHas(s, ["employee", "user"]));
        if (entity) { correctShapeIds.add(entity.id); results.push({ text: "Entity: Employee", pass: true }); } else { results.push({ text: "Entity: Employee", pass: false }); }
        var procs = shapes.filter(s => s.type === "process" && labelHas(s, ["record", "create", "ticket", "process", "retrieve"]));
        if (procs.length >= 2) { procs.forEach(p => correctShapeIds.add(p.id)); results.push({ text: "At least two Processes", pass: true }); } else { results.push({ text: "At least two Processes", pass: false }); }
        var store1 = shapes.find(s => s.type === "datastore" && labelHas(s, ["employee", "record"]));
        if (store1) { correctShapeIds.add(store1.id); results.push({ text: "Data Store: Employee", pass: true }); } else { results.push({ text: "Data Store: Employee", pass: false }); }
        var store2 = shapes.find(s => s.type === "datastore" && labelHas(s, ["ticket", "record"]));
        if (store2) { correctShapeIds.add(store2.id); results.push({ text: "Data Store: Ticket", pass: true }); } else { results.push({ text: "Data Store: Ticket", pass: false }); }
        return results;
      }
    },
    q4: {
      title: "Q4: Network fault reporting system",
      desc: "Employee reports fault. Tech receives details.",
      rules: "<strong>Requirements:</strong><br><ul><li>Entities: Employee, Technician</li><li>2+ Processes</li><li>Data Stores: Device, Fault</li></ul>",
      check: function(shapes) {
        var results = [];
        var emp = shapes.find(s => s.type === "entity" && labelHas(s, ["employee", "user"]));
        if (emp) { correctShapeIds.add(emp.id); results.push({ text: "Entity: Employee", pass: true }); } else { results.push({ text: "Entity: Employee", pass: false }); }
        var tech = shapes.find(s => s.type === "entity" && labelHas(s, ["technician", "tech"]));
        if (tech) { correctShapeIds.add(tech.id); results.push({ text: "Entity: Technician", pass: true }); } else { results.push({ text: "Entity: Technician", pass: false }); }
        var procs = shapes.filter(s => s.type === "process");
        if (procs.length >= 2) { procs.forEach(p => correctShapeIds.add(p.id)); results.push({ text: "At least two Processes", pass: true }); } else { results.push({ text: "At least two Processes", pass: false }); }
        var store1 = shapes.find(s => s.type === "datastore" && labelHas(s, ["device", "network"]));
        if (store1) { correctShapeIds.add(store1.id); results.push({ text: "Data Store: Device", pass: true }); } else { results.push({ text: "Data Store: Device", pass: false }); }
        var store2 = shapes.find(s => s.type === "datastore" && labelHas(s, ["fault", "record"]));
        if (store2) { correctShapeIds.add(store2.id); results.push({ text: "Data Store: Fault", pass: true }); } else { results.push({ text: "Data Store: Fault", pass: false }); }
        return results;
      }
    },
    q5: {
      title: "Q5: Cyber security incident management",
      desc: "Employee reports. Analyst investigates.",
      rules: "<strong>Requirements:</strong><br><ul><li>Entities: Employee, Analyst</li><li>3+ Processes</li><li>Data Stores: Employee, Incident</li></ul>",
      check: function(shapes) {
        var results = [];
        var emp = shapes.find(s => s.type === "entity" && labelHas(s, ["employee", "user"]));
        if (emp) { correctShapeIds.add(emp.id); results.push({ text: "Entity: Employee", pass: true }); } else { results.push({ text: "Entity: Employee", pass: false }); }
        var analyst = shapes.find(s => s.type === "entity" && labelHas(s, ["analyst", "security"]));
        if (analyst) { correctShapeIds.add(analyst.id); results.push({ text: "Entity: Analyst", pass: true }); } else { results.push({ text: "Entity: Analyst", pass: false }); }
        var procs = shapes.filter(s => s.type === "process");
        if (procs.length >= 3) { procs.forEach(p => correctShapeIds.add(p.id)); results.push({ text: "At least three Processes", pass: true }); } else { results.push({ text: "At least three Processes", pass: false }); }
        var store1 = shapes.find(s => s.type === "datastore" && labelHas(s, ["employee", "record"]));
        if (store1) { correctShapeIds.add(store1.id); results.push({ text: "Data Store: Employee", pass: true }); } else { results.push({ text: "Data Store: Employee", pass: false }); }
        var store2 = shapes.find(s => s.type === "datastore" && labelHas(s, ["incident", "record", "security"]));
        if (store2) { correctShapeIds.add(store2.id); results.push({ text: "Data Store: Incident", pass: true }); } else { results.push({ text: "Data Store: Incident", pass: false }); }
        return results;
      }
    }
  };

  // ---------- Hit Tests ----------
  function pointInRect(px, py, rx, ry, rw, rh) { return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh; }
  function pointInEllipse(px, py, cx, cy, rx, ry) { var dx = px - cx, dy = py - cy; return (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1; }
  function pointInArrow(px, py, x1, y1, x2, y2) {
    var minX = Math.min(x1, x2) - 15, maxX = Math.max(x1, x2) + 15; var minY = Math.min(y1, y2) - 15, maxY = Math.max(y1, y2) + 15;
    return px >= minX && px <= maxX && py >= minY && py <= maxY;
  }

  function getShapeAt(x, y) {
    for (var i = shapes.length - 1; i >= 0; i--) {
      var s = shapes[i];
      if (s.type === "arrow" && pointInArrow(x, y, s.x1, s.y1, s.x2, s.y2)) return s;
      if (s.type === "datastore" && pointInRect(x, y, s.x, s.y, s.w, s.h)) return s;
      if (s.type === "process" && pointInRect(x, y, s.x, s.y, s.w, s.h)) return s;
      if (s.type === "entity" && pointInEllipse(x, y, s.cx, s.cy, s.rx, s.ry)) return s;
    }
    return null;
  }

  function moveShape(shape, dx, dy) {
    if (shape.type === "arrow") { shape.x1 += dx; shape.y1 += dy; shape.x2 += dx; shape.y2 += dy; }
    else if (shape.type === "entity") { shape.cx += dx; shape.cy += dy; }
    else { shape.x += dx; shape.y += dy; }
  }

  // ---------- Create Factory Functions ----------
  var defaultStroke = "#1f2937";
  var defaultWidth = 4;

  function makeDataStore(x, y) { return { id: genId(), type: "datastore", x: x - 80, y: y - 30, w: 160, h: 60, fill: "#ffffff", stroke: defaultStroke, lineWidth: defaultWidth, label: "Data Store", scale: 1 }; }
  function makeProcess(x, y) { return { id: genId(), type: "process", x: x - 90, y: y - 50, w: 180, h: 100, fill: "#f3e8ff", stroke: defaultStroke, lineWidth: defaultWidth, label: "Process", scale: 1 }; }
  function makeEntity(x, y) { return { id: genId(), type: "entity", cx: x, cy: y, rx: 80, ry: 45, fill: "#fce7f3", stroke: "#1e3a8a", lineWidth: 3, label: "Entity", scale: 1 }; }
  function makeArrow(x, y) { return { id: genId(), type: "arrow", x1: x - 60, y1: y, x2: x + 60, y2: y, fill: defaultStroke, stroke: defaultStroke, lineWidth: 3, label: "", scale: 1 }; }

  // ---------- Scene Management ----------
  function resetScene() {
    shapes = []; nextId = 1; selectedId = null; correctShapeIds.clear();
    rotateControl.style.display = "none"; scaleControl.style.display = "none";
    if (currentChallenge === "none") {
      var cx = 750, cy = 300;
      var s1 = makeEntity(cx, cy - 180); s1.label = "Customer"; shapes.push(s1);
      var a1 = makeArrow(cx, cy - 120); a1.y1 = cy - 120; a1.y2 = cy - 70; a1.x1 = cx; a1.x2 = cx; shapes.push(a1);
      var s2 = makeProcess(cx, cy + 10); s2.label = "Process Order"; shapes.push(s2);
      var a2 = makeArrow(cx, cy + 100); a2.y1 = cy + 100; a2.y2 = cy + 150; a2.x1 = cx; a2.x2 = cx; shapes.push(a2);
      var s3 = makeDataStore(cx, cy + 220); s3.label = "Order Database"; shapes.push(s3);
    }
    draw();
  }

  // ---------- Drawing Helpers ----------
  function drawArrowHead(x, y, angle, size, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-size, -size * 0.6); ctx.lineTo(-size, size * 0.6);
    ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
  }

  function drawLabel(shape) {
    if (!shape.label) return;
    ctx.save(); ctx.fillStyle = "#1e293b"; 
    var fontSize = 15 * (shape.scale || 1);
    ctx.font = "600 " + fontSize + "px system-ui, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    if (shape.type === "arrow") {
      var cx = (shape.x1 + shape.x2) / 2; var cy = (shape.y1 + shape.y2) / 2;
      var angle = Math.atan2(shape.y2 - shape.y1, shape.x2 - shape.x1);
      ctx.translate(cx, cy); ctx.rotate(angle);
      var lines = shape.label.split('\n'); var lineHeight = 20;
      var startY = -16 - ((lines.length - 1) * lineHeight) / 2;
      for (var i = 0; i < lines.length; i++) {
        var textWidth = ctx.measureText(lines[i]).width;
        ctx.fillStyle = "#ffffff"; ctx.fillRect(-textWidth/2 - 4, startY + (i * lineHeight) - 9, textWidth + 8, 18);
        ctx.fillStyle = "#1e293b"; ctx.fillText(lines[i], 0, startY + (i * lineHeight));
      }
      ctx.restore(); return;
    }

    var cx = 0, cy = 0;
    if (shape.type === "entity") { cx = shape.cx; cy = shape.cy; } 
    else { cx = shape.x + shape.w / 2; cy = shape.y + shape.h / 2; }
    var lines = shape.label.split('\n'); var lineHeight = 20;
    var startY = cy - ((lines.length - 1) * lineHeight) / 2;
    for (var i = 0; i < lines.length; i++) { ctx.fillText(lines[i], cx, startY + (i * lineHeight)); }
    ctx.restore();
  }

  function drawShape(shape, isSelected) {
    ctx.save(); ctx.lineWidth = shape.lineWidth || 3; ctx.strokeStyle = shape.stroke || "#1f2937"; ctx.fillStyle = shape.fill || "#ffffff"; ctx.lineJoin = "round";

    if (shape.type === "datastore") {
      ctx.beginPath(); ctx.moveTo(shape.x, shape.y); ctx.lineTo(shape.x + shape.w, shape.y);     
      ctx.moveTo(shape.x, shape.y + shape.h); ctx.lineTo(shape.x + shape.w, shape.y + shape.h); 
      ctx.moveTo(shape.x, shape.y); ctx.lineTo(shape.x, shape.y + shape.h);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(shape.x + 25, shape.y); ctx.lineTo(shape.x + 25, shape.y + shape.h); ctx.stroke();
    } else if (shape.type === "process") {
      ctx.beginPath(); ctx.rect(shape.x, shape.y, shape.w, shape.h); ctx.fill(); ctx.stroke();
      var topH = 30;
      ctx.beginPath(); ctx.moveTo(shape.x, shape.y + topH); ctx.lineTo(shape.x + shape.w, shape.y + topH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(shape.x + 35, shape.y); ctx.lineTo(shape.x + 35, shape.y + topH); ctx.stroke();
    } else if (shape.type === "entity") {
      ctx.beginPath(); ctx.ellipse(shape.cx, shape.cy, shape.rx, shape.ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (shape.type === "arrow") {
      ctx.beginPath(); ctx.moveTo(shape.x1, shape.y1); ctx.lineTo(shape.x2, shape.y2);
      ctx.lineWidth = 3; ctx.strokeStyle = shape.fill; ctx.stroke();
      var angle = Math.atan2(shape.y2 - shape.y1, shape.x2 - shape.x1); drawArrowHead(shape.x2, shape.y2, angle, 15, shape.fill);
    }

    drawLabel(shape);

    if (isSelected) {
      ctx.lineWidth = 2.5; ctx.strokeStyle = "#3b82f6"; ctx.setLineDash([6, 4]);
      if (shape.type === "entity") { ctx.beginPath(); ctx.ellipse(shape.cx, shape.cy, shape.rx + 6, shape.ry + 6, 0, 0, Math.PI * 2); ctx.stroke(); }
      else if (shape.type === "arrow") { ctx.beginPath(); ctx.moveTo(shape.x1, shape.y1); ctx.lineTo(shape.x2, shape.y2); ctx.stroke(); }
      else { ctx.strokeRect(shape.x - 6, shape.y - 6, shape.w + 12, shape.h + 12); }
      ctx.setLineDash([]);
    }

    if (correctShapeIds.has(shape.id)) {
      ctx.save(); ctx.strokeStyle = "#10b981"; ctx.lineWidth = 4;
      ctx.beginPath();
      if (shape.type === "entity") { ctx.ellipse(shape.cx, shape.cy, shape.rx + 15, shape.ry + 15, 0, 0, Math.PI * 2); }
      else if (shape.type === "arrow") { ctx.moveTo(shape.x1, shape.y1); ctx.lineTo(shape.x2, shape.y2); }
      else { ctx.rect(shape.x - 10, shape.y - 10, shape.w + 20, shape.h + 20); }
      ctx.stroke();
      var tickX = shape.x ? (shape.x + shape.w + 10) : (shape.cx + 20); var tickY = shape.y ? (shape.y - 10) : (shape.cy - 20);
      ctx.beginPath(); ctx.moveTo(tickX, tickY + 5); ctx.lineTo(tickX + 5, tickY + 10); ctx.lineTo(tickX + 15, tickY); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1;
    for (var x = 0; x < canvas.width; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
    for (var y = 0; y < canvas.height; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
    ctx.restore();
    for (var i = 0; i < shapes.length; i++) { drawShape(shapes[i], shapes[i].id === selectedId); }
  }

  // ---------- Interaction ----------
  function getCanvasCoords(evt) {
    var rect = canvas.getBoundingClientRect(); var scaleX = canvas.width / rect.width; var scaleY = canvas.height / rect.height;
    return { x: (evt.clientX - rect.left) * scaleX, y: (evt.clientY - rect.top) * scaleY };
  }

  var dragging = false; var dragShapeId = null; var lastX = 0, lastY = 0;

  function updateInputState() {
    if (selectedId === null) {
      textInput.value = ""; textInput.disabled = true; textInput.placeholder = "Select a shape...";
      rotateControl.style.display = "none"; scaleControl.style.display = "none";
    } else {
      var shape = shapes.find(s => s.id === selectedId);
      if (shape) {
        textInput.value = shape.label || ""; textInput.disabled = false; textInput.placeholder = "Type label...";
        scaleControl.style.display = "flex"; scaleSlider.value = shape.scale || 1.0;
        if (shape.type === "arrow") {
          rotateControl.style.display = "flex";
          var angleRad = Math.atan2(shape.y2 - shape.y1, shape.x2 - shape.x1);
          var angleDeg = Math.round(angleRad * 180 / Math.PI);
          if (angleDeg < 0) angleDeg += 360;
          rotateSlider.value = angleDeg;
        } else { rotateControl.style.display = "none"; }
      }
    }
  }

  function onDown(evt) {
    evt.preventDefault(); var p = getCanvasCoords(evt); var shape = getShapeAt(p.x, p.y);
    if (shape) {
      selectedId = shape.id; var idx = shapes.indexOf(shape); if (idx > -1) { shapes.splice(idx, 1); shapes.push(shape); }
      dragging = true; dragShapeId = shape.id; lastX = p.x; lastY = p.y;
      if (canvas.setPointerCapture && evt.pointerId !== undefined) { try { canvas.setPointerCapture(evt.pointerId); } catch (e) {} }
    } else { selectedId = null; dragging = false; }
    updateInputState(); draw();
  }

  function onMove(evt) {
    if (!dragging || dragShapeId === null) return;
    evt.preventDefault(); var p = getCanvasCoords(evt); var dx = p.x - lastX, dy = p.y - lastY;
    if (dx === 0 && dy === 0) return;
    var shape = shapes.find(s => s.id === dragShapeId);
    if (shape) { moveShape(shape, dx, dy); lastX = p.x; lastY = p.y; draw(); }
  }

  function onUp() { if (!dragging) return; dragging = false; dragShapeId = null; draw(); }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("pointerleave", onUp);

  textInput.addEventListener("input", function(e) {
    if (selectedId === null) return; var shape = shapes.find(s => s.id === selectedId);
    if (shape) { shape.label = e.target.value; draw(); }
  });
  textInput.addEventListener("keydown", function(e) { if (e.key === "Enter") textInput.blur(); });

  // Rotate Logic
  rotateSlider.addEventListener("input", function(e) {
    if (selectedId === null) return; var shape = shapes.find(s => s.id === selectedId);
    if (shape && shape.type === "arrow") {
      var cx = (shape.x1 + shape.x2) / 2, cy = (shape.y1 + shape.y2) / 2;
      var len = Math.hypot(shape.x2 - shape.x1, shape.y2 - shape.y1); var halfLen = len / 2;
      var angleDeg = parseFloat(e.target.value); var angleRad = angleDeg * Math.PI / 180;
      shape.x1 = cx - Math.cos(angleRad) * halfLen; shape.y1 = cy - Math.sin(angleRad) * halfLen;
      shape.x2 = cx + Math.cos(angleRad) * halfLen; shape.y2 = cy + Math.sin(angleRad) * halfLen;
      draw();
    }
  });

  // Scale Logic
  scaleSlider.addEventListener("input", function(e) {
    if (selectedId === null) return; var shape = shapes.find(s => s.id === selectedId);
    if (shape) {
      var newScale = parseFloat(e.target.value); var oldScale = shape.scale || 1;
      if (shape.type === "arrow") {
        var cx = (shape.x1 + shape.x2) / 2; var cy = (shape.y1 + shape.y2) / 2;
        var len = Math.hypot(shape.x2 - shape.x1, shape.y2 - shape.y1); var newLen = len * (newScale / oldScale);
        var angle = Math.atan2(shape.y2 - shape.y1, shape.x2 - shape.x1);
        shape.x1 = cx - Math.cos(angle) * (newLen / 2); shape.y1 = cy - Math.sin(angle) * (newLen / 2);
        shape.x2 = cx + Math.cos(angle) * (newLen / 2); shape.y2 = cy + Math.sin(angle) * (newLen / 2);
      } else if (shape.type === "entity") {
        var ratio = newScale / oldScale; shape.rx *= ratio; shape.ry *= ratio;
      } else {
        var ratio = newScale / oldScale; var cx = shape.x + shape.w / 2; var cy = shape.y + shape.h / 2;
        shape.w *= ratio; shape.h *= ratio;
        shape.x = cx - shape.w / 2; shape.y = cy - shape.h / 2;
      }
      shape.scale = newScale; draw();
    }
  });

  // ---------- Toolbar Events ----------
  document.getElementById("resetBtn").addEventListener("click", resetScene);
  document.getElementById("closeBtn").addEventListener("click", function() {
    window.close();
    setTimeout(function() { alert("Your browser blocked the automatic tab closure.\nPlease close this tab manually."); }, 100);
  });

  function addNewShape(factoryFn) {
    var wrap = document.getElementById("canvasWrap"); var centerX = wrap.scrollLeft + (wrap.clientWidth / 2); var centerY = wrap.scrollTop + (wrap.clientHeight / 2);
    centerX += (Math.random() * 40 - 20); centerY += (Math.random() * 40 - 20);
    var newShape = factoryFn(centerX, centerY); shapes.push(newShape); selectedId = newShape.id;
    correctShapeIds.delete(newShape.id);
    updateInputState(); draw();
  }

  document.getElementById("addDataStore").addEventListener("click", function() { addNewShape(makeDataStore); });
  document.getElementById("addProcess").addEventListener("click", function() { addNewShape(makeProcess); });
  document.getElementById("addEntity").addEventListener("click", function() { addNewShape(makeEntity); });
  document.getElementById("addArrow").addEventListener("click", function() { addNewShape(makeArrow); });

  // ---------- Challenge Mode Logic ----------
  challengeSelect.addEventListener("change", function(e) {
    currentChallenge = e.target.value;
    resetScene();
    if (currentChallenge === "none") {
      questionPanel.style.display = "none"; checkBtn.style.display = "none";
    } else {
      var q = questionsData[currentChallenge];
      document.getElementById("qTitle").textContent = q.title;
      document.getElementById("qDesc").textContent = q.desc;
      document.getElementById("qRules").innerHTML = q.rules;
      questionPanel.style.display = "flex"; checkBtn.style.display = "inline-flex";
    }
  });

  checkBtn.addEventListener("click", function() {
    if (currentChallenge === "none") return;
    correctShapeIds.clear();
    var q = questionsData[currentChallenge];
    var results = q.check(shapes);
    var allPassed = true; var failMessages = [];
    results.forEach(function(r) {
      if (!r.pass) { allPassed = false; failMessages.push("❌ " + r.text); }
    });
    draw();
    if (allPassed) { alert("🎉 Perfect! Your DFD includes all the correct elements."); }
    else {
      var msg = "Almost there! You are missing:\n\n" + failMessages.join("\n") + "\n\n(Hint: Correct shapes have a green tick!)";
      alert(msg);
    }
  });

  resetScene();
})();
</script>
</body>
</html>
